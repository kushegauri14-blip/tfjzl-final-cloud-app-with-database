<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ course.name }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="mb-3">{{ course.name }}</h1>

            <p class="text-muted">
                {{ course.description }}
            </p>

            <hr>

            <h2 class="h4 mb-3">Course Lessons</h2>

            {% for lesson in course.lessons.all %}
                <div class="card mb-3">
                    <div class="card-body">

                        <h3 class="h5">{{ lesson.title }}</h3>

                        <p>{{ lesson.content }}</p>

                    </div>
                </div>
            {% empty %}
                <div class="alert alert-info">
                    No lessons are available for this course yet.
                </div>
            {% endfor %}

        </div>
    </div>

</div>

</body>
</html>
